        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: monospace;
        }
        html,
        body{
            height: 100%;
            width: 100%;
        }
        #main{
            background-color: #222;
            width: 100%;
            height: 100%;
            padding: 30px;
        }
        input{
            display: block;
            margin: 12px;
            padding: 12px;
            font-size: 18px; 
        }
        input[type="submit"]{
            cursor: pointer;
        }
        .card{
            max-width: 220px;
            margin: 12px;
            padding: 20px;
            border: 1px solid #555;
            display: inline-block;
            border-radius: 10px;
            color: #fff;
        }
        .card p{
            font-size: 12px;
            margin-top: 10px;
        }
        .card h5{
            font-size: 14px;
            margin-top: 10px;
        }
        .profile{
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card h3{
            font-size: 16px;
        }
