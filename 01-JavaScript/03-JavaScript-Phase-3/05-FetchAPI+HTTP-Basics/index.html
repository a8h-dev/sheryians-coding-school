<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500">

  <div class="w-80 bg-white/20 backdrop-blur-xl border border-white/30 rounded-2xl shadow-xl p-6 text-center text-white">
    
    <!-- Profile Image -->
    <img 
      src="https://i.pravatar.cc/150?img=12"
      alt="user"
      class="w-24 h-24 mx-auto rounded-full border-4 border-white/50 shadow-md"
    />

    <!-- Name -->
    <h2 class="mt-4 text-xl font-semibold">
      Abhishek Mahto
    </h2>

    <!-- Role -->
    <p class="text-sm text-white/80">
      Frontend Developer
    </p>

    <!-- Bio -->
    <p class="mt-3 text-sm text-white/70">
      Clean UI, smooth animations aur thoda sa creative code ✨
    </p>

    <!-- Buttons -->
    <div class="mt-5 flex gap-3 justify-center">
      <button class="px-4 py-2 text-sm rounded-lg bg-white text-black font-medium hover:bg-white/90 transition">
        Follow
      </button>
      <button class="px-4 py-2 text-sm rounded-lg border border-white/50 hover:bg-white/10 transition">
        Message
      </button>
    </div>

  </div>

</body>
</html>
